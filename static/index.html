<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rise OS</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-gray-100 font-sans min-h-screen">

    <div id="auth-card" class="max-w-md mx-auto mt-20 p-6 bg-gray-900 border border-gray-800 rounded-xl shadow-2xl">
        <h1 class="text-3xl font-bold text-amber-500 text-center mb-6">Rise OS</h1>
        <div class="space-y-4">
            <input type="email" id="email" placeholder="Email" class="w-full p-3 bg-gray-800 border border-gray-700 rounded text-white focus:outline-none focus:border-amber-500">
            <input type="password" id="password" placeholder="Password" class="w-full p-3 bg-gray-800 border border-gray-700 rounded text-white focus:outline-none focus:border-amber-500">
            <div class="flex gap-4">
                <button onclick="login()" class="w-1/2 bg-amber-500 hover:bg-amber-600 text-gray-950 font-bold py-3 rounded transition">Login</button>
                <button onclick="register()" class="w-1/2 bg-gray-800 hover:bg-gray-700 text-white font-bold py-3 rounded border border-gray-600 transition">Register</button>
            </div>
        </div>
    </div>

    <div id="dashboard" class="hidden max-w-6xl mx-auto p-4 md:p-8 space-y-6">
        
        <header class="flex flex-col md:flex-row justify-between items-center p-6 bg-gray-900 border border-gray-800 rounded-xl gap-4">
            <div>
                <h1 class="text-2xl font-bold text-amber-500">Rise OS</h1>
                <p id="user-email" class="text-sm text-gray-400"></p>
            </div>
            <div class="flex gap-6 items-center">
                <div class="text-center">
                    <span class="text-xs text-gray-400 block uppercase tracking-wider">Points</span>
                    <span id="user-points" class="text-xl font-bold text-amber-400">0</span>
                </div>
                <div class="text-center">
                    <span class="text-xs text-gray-400 block uppercase tracking-wider">XP</span>
                    <span id="user-xp" class="text-xl font-bold text-emerald-400">0</span>
                </div>
                <button onclick="logout()" class="px-4 py-2 bg-gray-800 hover:bg-gray-700 text-red-400 border border-gray-700 rounded text-sm font-semibold">Logout</button>
            </div>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            
            <section class="md:col-span-2 bg-gray-900 border border-gray-800 rounded-xl p-6 space-y-4">
                <h2 class="text-xl font-bold text-white flex justify-between items-center">
                    Tasks
                    <span class="text-xs font-normal text-gray-400">Auto-Synced</span>
                </h2>
                
                <div class="flex gap-2">
                    <input type="text" id="task-title" placeholder="New Task..." class="flex-1 p-3 bg-gray-800 border border-gray-700 rounded text-white focus:outline-none focus:border-amber-500">
                    <select id="task-priority" class="p-3 bg-gray-800 border border-gray-700 rounded text-white">
                        <option value="low">Low</option>
                        <option value="medium" selected>Medium</option>
                        <option value="high">High</option>
                    </select>
                    <button onclick="createTask()" class="px-5 bg-amber-500 hover:bg-amber-600 text-gray-950 font-bold rounded">Add</button>
                </div>

                <ul id="task-list" class="space-y-2 max-h-96 overflow-y-auto"></ul>
            </section>

            <div class="space-y-6">
                
                <section class="bg-gray-900 border border-gray-800 rounded-xl p-6 space-y-4">
                    <h2 class="text-xl font-bold text-white">Focus Session</h2>
                    <div class="text-center py-4">
                        <div id="timer-display" class="text-4xl font-mono font-bold text-amber-500">25:00</div>
                    </div>
                    <div class="flex gap-2">
                        <button id="timer-btn" onclick="toggleTimer()" class="w-full py-2 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded">Start Focus</button>
                    </div>
                </section>

                <section class="bg-gray-900 border border-gray-800 rounded-xl p-6 space-y-4">
                    <h2 class="text-xl font-bold text-white">Daily Habits</h2>
                    <div class="flex gap-2">
                        <input type="text" id="habit-title" placeholder="New Habit..." class="flex-1 p-2 bg-gray-800 border border-gray-700 rounded text-white text-sm">
                        <button onclick="createHabit()" class="px-3 bg-amber-500 text-gray-950 font-bold rounded text-sm">+</button>
                    </div>
                    <ul id="habit-list" class="space-y-2"></ul>
                </section>

            </div>
        </div>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
